<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="metal" x1="20" y1="0" x2="80" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d8e2e8"/>
      <stop offset="50%" stop-color="#8fa4b4"/>
      <stop offset="100%" stop-color="#b8c8d2"/>
    </linearGradient>
  </defs>

  <!-- Water splash (hook dips into it) -->
  <ellipse cx="52" cy="83" rx="30" ry="8" fill="#1a7dc4" opacity="0.72"/>
  <ellipse cx="44" cy="81" rx="15" ry="3.5" fill="#5bb3f0" opacity="0.42"/>
  <ellipse cx="20" cy="77" rx="6" ry="3.5" fill="#1a7dc4" opacity="0.55" transform="rotate(-38 20 77)"/>
  <ellipse cx="84" cy="77" rx="6" ry="3.5" fill="#1a7dc4" opacity="0.55" transform="rotate(38 84 77)"/>
  <circle cx="12" cy="73" r="2.5" fill="#4aaee8" opacity="0.5"/>
  <circle cx="90" cy="72" r="2" fill="#4aaee8" opacity="0.5"/>
  <circle cx="28" cy="70" r="1.5" fill="#4aaee8" opacity="0.4"/>
  <circle cx="76" cy="69" r="1.5" fill="#4aaee8" opacity="0.4"/>

  <!-- Hook eye (ring at top) -->
  <circle cx="38" cy="11" r="7" fill="none" stroke="url(#metal)" stroke-width="4.5"/>

  <!-- Hook shank, bend, and point -->
  <path d="M 38 18 L 38 59 Q 38 76 56 76 Q 70 76 70 61 L 70 40"
        fill="none" stroke="url(#metal)" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Barb -->
  <line x1="70" y1="48" x2="61" y2="55"
        stroke="url(#metal)" stroke-width="3.5" stroke-linecap="round"/>
</svg>
