title: "Gone Phishing"
description: "Free education on social engineering, phishing, and staying safe online."
url: "https://gonephishing.org"
baseurl: ""

remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "default"

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

collections:
  resources:
    output: true
    permalink: /resources/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      toc: true
      comments: false
      share: true
  - scope:
      path: ""
      type: resources
    values:
      layout: single
      author_profile: false
      toc: false

markdown: kramdown
kramdown:
  input: GFM

include:
  - _pages
